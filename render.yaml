services:
  # FastAPI Backend Service
  - type: web
    name: multi-agent-backend
    env: python
    region: oregon
    plan: standard
    healthCheckPath: /health
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION_NAME
        value: project_documents
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: multi-agent-e8d98
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  # Next.js Frontend Service
  - type: web
    name: multi-agent-frontend
    env: node
    region: oregon
    plan: standard
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: multi-agent-backend
          property: host
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: multi-agent-e8d98.firebaseapp.com
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        value: multi-agent-e8d98
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        value: multi-agent-e8d98.firebasestorage.app
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        value: "526659044247"
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        value: "1:526659044247:web:0d46a8cc574b1daac6fad2"
